name: SnakePlugin
version: '${project.version}'
main: com.josebtan.snakeplugin.SnakePlugin
api-version: '1.20'
author: josebtan
description: Clasico juego de Snake para Minecraft, multijugador, con skins de bloques configurables.
depend: [ProtocolLib]

commands:
  snake:
    description: "Comando definitivo del plugin: arenas (campo de juego), control de partida y recarga de config. Reemplaza a /snakedebug (Etapa 1)."
    usage: "/snake <arena [menu|pos1|pos2|create <nombre>|delete <nombre>|list]|join [arena]|leave|reload>"

permissions:
  snakeplugin.arena.admin:
    description: "Permite crear/administrar arenas con /snake arena ..."
    default: op
  snakeplugin.reload:
    description: "Permite recargar config.yml (modo de movimiento y skins) con /snake reload."
    default: op
