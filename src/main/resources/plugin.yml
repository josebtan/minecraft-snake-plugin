name: SnakePlugin
version: '${project.version}'
main: com.josebtan.snakeplugin.SnakePlugin
api-version: '1.20'
author: josebtan
description: Clasico juego de Snake para Minecraft, multijugador, con bloques de lana de colores.
depend: [ProtocolLib]

commands:
  snake:
    description: "Comando definitivo del plugin: arenas (campo de juego) y control de partida. Reemplaza a /snakedebug (Etapa 1)."
    usage: "/snake <arena pos1|arena pos2|arena create <nombre>|arena delete <nombre>|arena list|join <arena>|leave>"

permissions:
  snakeplugin.arena.admin:
    description: "Permite crear/administrar arenas con /snake arena ..."
    default: op
